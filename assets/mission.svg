<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560"><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1b2a3e" stroke-opacity=".55"/></pattern></defs><rect width="1200" height="560" fill="#05080f"/><rect width="1200" height="560" fill="url(#g)"/><text x="32" y="46" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="3" fill="#3ee0f0">SEC-01</text><text x="112" y="50" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="40" fill="#dbe5f0">THE MISSION</text><rect x="32" y="74" width="1136" height="250" fill="#0b1220" stroke="#1b2a3e"/><path d="M32 92 V74 H50 M1150 324 H1168 V306" fill="none" stroke="#3ee0f0" stroke-width="3"/><text x="60" y="108" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="12" letter-spacing="3" fill="#7d8ea3">DISSERTATION · MECHANICAL ENGINEERING · FIU</text><text x="60" y="148" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="32" fill="#dbe5f0">CRITICAL INFRASTRUCTURE ASSESSMENT USING</text><text x="60" y="184" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="32" fill="#dbe5f0">AUTONOMOUS SWARM OF DRONES WITH SENSOR PAYLOADS</text><text x="60" y="222.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9c6d6">Aging nuclear and civil concrete needs inspection in places that are dark, cramped, radioactive and out of GPS range. I build</text><text x="60" y="243.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9c6d6">heterogeneous robot teams that go in together: drones for walls and ceilings, legged and climbing robots for contact sensing. They scan,</text><text x="60" y="264.1" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9c6d6">share what they find, hand suspicious spots to a teammate with the right sensor, and fuse it all into one picture. Working under Dr.</text><text x="60" y="285.1" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b9c6d6">Leonel Lagos at FIU's Applied Research Center.</text><rect x="32.0" y="342" width="283.0" height="194" fill="#0f1828" stroke="#1b2a3e"/><rect x="32.0" y="342" width="283.0" height="3" fill="#3ee0f0"><animate attributeName="opacity" values=".4;1;.4" dur="3s" begin="0.0s" repeatCount="indefinite"/></rect><text x="54.0" y="376" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="12" letter-spacing="2" fill="#3ee0f0">PILLAR A</text><text x="54.0" y="410" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="20" fill="#dbe5f0">SENSOR FUSION</text><text x="54.0" y="440.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#7d8ea3">Geometry, subsurface, spectral,</text><text x="54.0" y="459.6" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#7d8ea3">thermal and radiation evidence</text><text x="54.0" y="479.1" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#7d8ea3">fused into one defect picture.</text><rect x="316.0" y="342" width="283.0" height="194" fill="#0f1828" stroke="#1b2a3e"/><rect x="316.0" y="342" width="283.0" height="3" fill="#9dff4a"><animate attributeName="opacity" values=".4;1;.4" dur="3s" begin="0.5s" repeatCount="indefinite"/></rect><text x="338.0" y="376" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="12" letter-spacing="2" fill="#9dff4a">PILLAR B</text><text x="338.0" y="410" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="20" fill="#dbe5f0">HAZARD MAPPING</text><text x="338.0" y="440.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#7d8ea3">Radiation fields mapped</text><text x="338.0" y="459.6" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#7d8ea3">autonomously under strict dose</text><text x="338.0" y="479.1" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#7d8ea3">budgets.</text><rect x="600.0" y="342" width="283.0" height="194" fill="#0f1828" stroke="#1b2a3e"/><rect x="600.0" y="342" width="283.0" height="3" fill="#ffb547"><animate attributeName="opacity" values=".4;1;.4" dur="3s" begin="1.0s" repeatCount="indefinite"/></rect><text x="622.0" y="376" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="12" letter-spacing="2" fill="#ffb547">PILLAR C</text><text x="622.0" y="410" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="20" fill="#dbe5f0">SWARM AUTONOMY</text><text x="622.0" y="440.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#7d8ea3">Air and ground robots that</text><text x="622.0" y="459.6" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#7d8ea3">allocate tasks and navigate</text><text x="622.0" y="479.1" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#7d8ea3">without GPS.</text><rect x="884.0" y="342" width="283.0" height="194" fill="#0f1828" stroke="#1b2a3e"/><rect x="884.0" y="342" width="283.0" height="3" fill="#ff4d6a"><animate attributeName="opacity" values=".4;1;.4" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect><text x="906.0" y="376" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="12" letter-spacing="2" fill="#ff4d6a">PILLAR D</text><text x="906.0" y="410" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="20" fill="#dbe5f0">TRUST &amp; SECURITY</text><text x="906.0" y="440.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#7d8ea3">Catching spoofed telemetry and</text><text x="906.0" y="459.6" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#7d8ea3">compromised agents before they</text><text x="906.0" y="479.1" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#7d8ea3">corrupt the mission.</text></svg>
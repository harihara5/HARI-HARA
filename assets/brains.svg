<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470"><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1b2a3e" stroke-opacity=".55"/></pattern></defs><rect width="1200" height="470" fill="#05080f"/><rect width="1200" height="470" fill="url(#g)"/><text x="32" y="46" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="3" fill="#3ee0f0">SEC-04</text><text x="112" y="50" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="40" fill="#dbe5f0">THE BRAINS</text><rect x="32" y="74" width="368" height="176" fill="#0b1220" stroke="#1b2a3e"/><text x="54" y="106" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="11.5" letter-spacing="2" fill="#7d8ea3">PERCEPTION</text><text x="54" y="142" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="24" fill="#3ee0f0">DEEP LEARNING</text><text x="54" y="172.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">Detects cracks, spalling, voids and corrosion</text><text x="54" y="192.3" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">across every modality.</text><rect x="416" y="74" width="368" height="176" fill="#0b1220" stroke="#1b2a3e"/><text x="438" y="106" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="11.5" letter-spacing="2" fill="#7d8ea3">DATA</text><text x="438" y="142" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="24" fill="#ffb547">GENERATIVE AI</text><text x="438" y="172.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">Synthetic rare defects and digital-twin data</text><text x="438" y="192.3" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">so models learn what inspections almost never</text><text x="438" y="212.6" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">see.</text><rect x="800" y="74" width="368" height="176" fill="#0b1220" stroke="#1b2a3e"/><text x="822" y="106" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="11.5" letter-spacing="2" fill="#7d8ea3">MISSION</text><text x="822" y="142" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="24" fill="#a98bff">AGENTIC AI</text><text x="822" y="172.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">LLM and VLM agents read sensor evidence, plan</text><text x="822" y="192.3" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">the next pass and hand off to the right</text><text x="822" y="212.6" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">teammate, with a safety shield that can veto</text><text x="822" y="232.9" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">them.</text><rect x="32" y="266" width="368" height="176" fill="#0b1220" stroke="#1b2a3e"/><text x="54" y="298" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="11.5" letter-spacing="2" fill="#7d8ea3">LEARNING</text><text x="54" y="334" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="24" fill="#5ef2c5">FEDERATED LEARNING</text><text x="54" y="364.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">Each robot learns from its own sensor and</text><text x="54" y="384.3" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">shares compact model updates instead of raw</text><text x="54" y="404.6" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">data.</text><rect x="416" y="266" width="368" height="176" fill="#0b1220" stroke="#1b2a3e"/><text x="438" y="298" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="11.5" letter-spacing="2" fill="#7d8ea3">EDGE</text><text x="438" y="334" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="24" fill="#4be39b">EDGE AI</text><text x="438" y="364.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">Onboard inference so robots keep working when</text><text x="438" y="384.3" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">the link drops.</text><rect x="800" y="266" width="368" height="176" fill="#0b1220" stroke="#1b2a3e"/><text x="822" y="298" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="11.5" letter-spacing="2" fill="#7d8ea3">TRUST</text><text x="822" y="334" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="24" fill="#ff4d6a">CYBER SECURITY</text><text x="822" y="364.0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">Anomaly detection and trust anchors that catch</text><text x="822" y="384.3" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b9c6d6">spoofed telemetry and rogue agents.</text></svg>